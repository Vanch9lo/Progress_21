<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Школьная система баллов</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      max-width: 900px;
      width: 100%;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .header p {
      opacity: 0.9;
    }

    .content {
      padding: 40px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 16px;
      transition: border-color 0.3s;
    }

    .form-group input:focus, .form-group select:focus {
      outline: none;
      border-color: #667eea;
    }

    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-success {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
    }

    .btn-danger {
      background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
    }

    .btn-small {
      padding: 8px 15px;
      font-size: 14px;
      width: auto;
    }

    .error {
      background: #f8d7da;
      color: #721c24;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .success {
      background: #d4edda;
      color: #155724;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .hidden {
      display: none;
    }

    .card {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h3 {
      color: #667eea;
      margin-bottom: 15px;
    }

    .balance-display {
      text-align: center;
      padding: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 15px;
      color: white;
      margin-bottom: 20px;
    }

    .balance-display .amount {
      font-size: 48px;
      font-weight: bold;
    }

    .balance-display .label {
      opacity: 0.9;
      font-size: 18px;
    }

    .nav {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .nav button {
      flex: 1;
      min-width: 150px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    table th, table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #e0e0e0;
    }

    table th {
      background: #667eea;
      color: white;
    }

    table tr:hover {
      background: #f8f9fa;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .badge-pending {
      background: #ffc107;
      color: #000;
    }

    .badge-approved {
      background: #28a745;
      color: white;
    }

    .badge-rejected {
      background: #dc3545;
      color: white;
    }

    .role-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .role-student {
      background: #17a2b8;
      color: white;
    }

    .role-teacher {
      background: #28a745;
      color: white;
    }

    .role-moderator {
      background: #fd7e14;
      color: white;
    }

    .role-owner {
      background: #6f42c1;
      color: white;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
    }

    .stat-card .number {
      font-size: 32px;
      font-weight: bold;
    }

    .stat-card .label {
      opacity: 0.9;
      font-size: 14px;
    }

    .logout-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 2px solid white;
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
    }

    .logout-btn:hover {
      background: white;
      color: #667eea;
    }

    .dashboard-wrapper {
      position: relative;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal.hidden {
      display: none !important;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 20px;
      max-width: 500px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-content h3 {
      margin-bottom: 20px;
      color: #667eea;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .modal-buttons .btn {
      flex: 1;
    }

    /* Device Selection Styles */
    .device-selection {
      text-align: center;
    }

    .device-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .device-option {
      background: #f8f9fa;
      border-radius: 15px;
      padding: 40px 20px;
      cursor: pointer;
      transition: all 0.3s;
      border: 3px solid transparent;
    }

    .device-option:hover {
      border-color: #667eea;
      transform: translateY(-5px);
    }

    .device-option.selected {
      border-color: #667eea;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .device-option .icon {
      font-size: 64px;
      margin-bottom: 15px;
    }

    .device-option .title {
      font-size: 20px;
      font-weight: bold;
    }

    .device-option .desc {
      font-size: 14px;
      opacity: 0.8;
      margin-top: 10px;
    }

    /* User rank display */
    .user-rank-card {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
      color: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    .user-rank-card .rank-number {
      font-size: 48px;
      font-weight: bold;
    }

    .user-rank-card .rank-label {
      opacity: 0.9;
      font-size: 16px;
    }

    /* Leaderboard scrollable */
    .leaderboard-container {
      max-height: 400px;
      overflow-y: auto;
    }

    .my-rank-row {
      background: linear-gradient(135deg, #28a745 0%, #20c997 100%) !important;
      color: white !important;
    }

    .my-rank-row td {
      color: white !important;
    }

    @media (max-width: 600px) {
      .content {
        padding: 20px;
      }
      
      .nav {
        flex-direction: column;
      }
      
      .nav button {
        width: 100%;
      }

      .device-options {
        grid-template-columns: 1fr;
      }

      .balance-display .amount {
        font-size: 36px;
      }

      table {
        font-size: 14px;
      }

      table th, table td {
        padding: 8px;
      }

      .modal-content {
        padding: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Device Selection -->
    <div id="device-selection" class="hidden">
      <div class="header">
        <h1>🎓 Школьная система баллов</h1>
        <p>Выберите тип устройства</p>
      </div>
      <div class="content device-selection">
        <div class="device-options">
          <div class="device-option" onclick="selectDevice('desktop')">
            <div class="icon">💻</div>
            <div class="title">Компьютер</div>
            <div class="desc">Полная версия для ПК и ноутбуков</div>
          </div>
          <div class="device-option" onclick="selectDevice('mobile')">
            <div class="icon">📱</div>
            <div class="title">Телефон</div>
            <div class="desc">Мобильная версия для смартфонов</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Login Form -->
    <div id="login-form" class="hidden">
      <div class="header">
        <h1>🎓 Школьная система баллов</h1>
        <p id="device-info-text">Войдите в систему для продолжения</p>
      </div>
      <div class="content">
        <div id="login-error" class="error hidden"></div>
        <div class="form-group">
          <label>Имя пользователя</label>
          <input type="text" id="username" placeholder="Введите имя пользователя">
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="password" placeholder="Введите пароль">
        </div>
        <button class="btn" onclick="login()">Войти</button>
        <p style="text-align: center; margin-top: 15px;">
          <a href="#" onclick="changeDevice()" style="color: #667eea;">← Сменить устройство</a>
        </p>
      </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="hidden">
      <div class="dashboard-wrapper">
        <button class="logout-btn" onclick="logout()">Выйти</button>
        <div class="header">
          <h1>🎓 Панель управления</h1>
          <p id="user-info"></p>
        </div>
        <div class="content">
          <div id="dashboard-content"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let token = localStorage.getItem('token');
    let currentUser = null;
    let deviceType = localStorage.getItem('deviceType') || null;

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      if (!deviceType) {
        // Show device selection
        document.getElementById('device-selection').classList.remove('hidden');
      } else if (token) {
        fetchCurrentUser();
      } else {
        showLoginForm();
      }
    });

    function selectDevice(type) {
      deviceType = type;
      localStorage.setItem('deviceType', type);
      
      // Update UI based on device
      if (type === 'mobile') {
        document.querySelector('.container').style.maxWidth = '100%';
        document.querySelector('.container').style.borderRadius = '0';
        document.body.style.padding = '0';
      }
      
      document.getElementById('device-selection').classList.add('hidden');
      
      if (token) {
        fetchCurrentUser();
      } else {
        showLoginForm();
      }
    }

    function showLoginForm() {
      document.getElementById('login-form').classList.remove('hidden');
      const deviceText = deviceType === 'mobile' ? '(Мобильная версия)' : '(Версия для ПК)';
      document.getElementById('device-info-text').textContent = deviceText + ' Войдите в систему';
    }

    function changeDevice() {
      localStorage.removeItem('deviceType');
      deviceType = null;
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('device-selection').classList.remove('hidden');
      // Reset styles
      document.querySelector('.container').style.maxWidth = '';
      document.querySelector('.container').style.borderRadius = '';
      document.body.style.padding = '';
    }

    async function fetchCurrentUser() {
      try {
        const res = await fetch('/api/me', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok) {
          currentUser = await res.json();
          // Ensure all properties are loaded
          if (!currentUser.profile_color) currentUser.profile_color = '#667eea';
          showDashboard();
        } else {
          localStorage.removeItem('token');
          token = null;
          showLoginForm();
        }
      } catch (err) {
        console.error(err);
        showLoginForm();
      }
    }

    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      
      if (!username || !password) {
        showError('login-error', 'Заполните все поля');
        return;
      }

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();
        
        if (res.ok) {
          token = data.token;
          currentUser = data.user;
          localStorage.setItem('token', token);
          showDashboard();
        } else {
          showError('login-error', data.error);
        }
      } catch (err) {
        showError('login-error', 'Ошибка соединения с сервером');
      }
    }

    function logout() {
      localStorage.removeItem('token');
      token = null;
      currentUser = null;
      document.getElementById('dashboard').classList.add('hidden');
      showLoginForm();
    }

    function showDashboard() {
      document.getElementById('login-form').classList.add('hidden');
      document.getElementById('device-selection').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      
      // Apply mobile styles if needed
      if (deviceType === 'mobile') {
        document.querySelector('.container').style.maxWidth = '100%';
        document.querySelector('.container').style.borderRadius = '0';
        document.body.style.padding = '0';
      }
      
      const roleNames = {
        student: 'Ученик',
        teacher: 'Учитель',
        moderator: 'Модератор',
        owner: 'Владелец'
      };
      
      document.getElementById('user-info').textContent = 
        `${currentUser.username} • ${roleNames[currentUser.role]}`;
      
      renderDashboard();
    }

    function renderDashboard() {
      const content = document.getElementById('dashboard-content');
      
      switch (currentUser.role) {
        case 'student':
          content.innerHTML = getStudentDashboard();
          loadStudentData();
          break;
        case 'teacher':
          content.innerHTML = getTeacherDashboard();
          loadStudents();
          break;
        case 'moderator':
        case 'owner':
          content.innerHTML = getModeratorDashboard();
          loadModeratorData();
          break;
      }
    }

    function getStudentDashboard() {
      return `
        <div class="balance-display" id="profile-display">
          <div class="label">Ваш баланс</div>
          <div class="amount" id="balance">${currentUser.balance}</div>
          <div class="label">баллов</div>
          <div style="margin-top: 10px; opacity: 0.9;">
            ID: ${currentUser.id} | Класс: ${currentUser.class || 'Не указан'}
            ${currentUser.title ? `<br>🏆 ${currentUser.title}` : ''}
          </div>
        </div>
        
        <div class="nav">
          <button class="btn btn-success" onclick="showImmunityModal()">📝 Переписать работу (50 баллов)</button>
          <button class="btn" onclick="showBellModal()">🎵 Песня на перемене (40 баллов)</button>
          <button class="btn" onclick="showProfileSection()">👤 Профиль</button>
          <button class="btn" onclick="showLeaderboard()">🏆 Лидеры</button>
          <button class="btn" onclick="showSearchModal()">🔍 Поиск</button>
          <button class="btn btn-secondary" onclick="loadStudentData()">🔄 Обновить</button>
        </div>
        
        <div id="student-content">
          <div class="card">
            <h3>📝 История транзакций</h3>
            <table id="transactions-table">
              <thead>
                <tr>
                  <th>От кого</th>
                  <th>Сумма</th>
                  <th>Причина</th>
                  <th>Дата</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>

          <div class="card">
            <h3>📋 Мои запросы</h3>
            <table id="requests-table">
              <thead>
                <tr>
                  <th>Тип</th>
                  <th>Детали</th>
                  <th>Стоимость</th>
                  <th>Статус</th>
                  <th>Дата</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
        </div>

        <!-- Modal for Immunity -->
        <div id="immunity-modal" class="modal hidden">
          <div class="modal-content">
            <h3>📝 Переписать любую работу</h3>
            <div class="form-group">
              <label>Выберите предмет:</label>
              <select id="immunity-subject">
                <option value="">-- Выберите предмет --</option>
                <option value="Математика">Математика</option>
                <option value="Русский язык">Русский язык</option>
                <option value="Литература">Литература</option>
                <option value="Физика">Физика</option>
                <option value="Химия">Химия</option>
                <option value="Биология">Биология</option>
                <option value="История">История</option>
                <option value="Обществознание">Обществознание</option>
                <option value="География">География</option>
                <option value="Английский язык">Английский язык</option>
                <option value="Информатика">Информатика</option>
                <option value="Физкультура">Физкультура</option>
                <option value="ОБЖ">ОБЖ</option>
                <option value="Музыка">Музыка</option>
                <option value="ИЗО">ИЗО</option>
                <option value="Технология">Технология</option>
              </select>
            </div>
            <p style="color: #666; margin-bottom: 15px;">Стоимость: <strong>50 баллов</strong></p>
            <p style="color: #e74c3c; margin-bottom: 15px; font-size: 14px;">⚠️ Доступно ученикам с 5 класса. Можно использовать раз в день.</p>
            <div class="modal-buttons">
              <button class="btn btn-success" onclick="requestImmunity()">Отправить</button>
              <button class="btn btn-secondary" onclick="closeModal('immunity-modal')">Отмена</button>
            </div>
          </div>
        </div>

        <!-- Modal for Bell -->
        <div id="bell-modal" class="modal hidden">
          <div class="modal-content">
            <h3>🎵 Песня на перемене</h3>
            <div class="form-group">
              <label>Тип запроса:</label>
              <select id="bell-type" onchange="updateBellForm()">
                <option value="song_link">🔗 Ссылка на песню</option>
                <option value="song_name">📝 Название песни</option>
                <option value="video">🎬 Видео</option>
              </select>
            </div>
            
            <!-- Ссылка на песню -->
            <div id="bell-link-field" class="form-group">
              <label>Ссылка на песню (YouTube или MP3):</label>
              <input type="text" id="bell-song-link" placeholder="https://youtube.com/... или ссылка на MP3">
            </div>
            
            <!-- Название песни -->
            <div id="bell-name-field" class="form-group hidden">
              <label>Название песни и исполнитель:</label>
              <input type="text" id="bell-song-name" placeholder="Например: Blinding Lights - The Weeknd">
            </div>
            
            <!-- Видео -->
            <div id="bell-video-field" class="form-group hidden">
              <label>Файл видео:</label>
              <input type="file" id="bell-video-file" accept="video/*" style="padding: 10px;">
              <p style="color: #666; font-size: 12px; margin-top: 5px;">Максимум 50MB</p>
            </div>
            
            <p style="color: #666; margin-bottom: 15px;">Стоимость: <strong>40 баллов</strong></p>
            <p style="color: #e74c3c; margin-bottom: 15px; font-size: 14px;">⚠️ Доступно ученикам с 5 класса. Можно использовать раз в день.</p>
            <div class="modal-buttons">
              <button class="btn btn-success" onclick="requestBell()">Отправить</button>
              <button class="btn btn-secondary" onclick="closeModal('bell-modal')">Отмена</button>
            </div>
          </div>
        </div>

        <!-- Modal for Profile -->
        <div id="profile-modal" class="modal hidden">
          <div class="modal-content" style="max-width: 700px;">
            <h3>👤 Мой профиль</h3>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-bottom: 20px;">
              <div>
                <div class="form-group">
                  <label>Цвет профиля:</label>
                  <input type="color" id="profile-color" value="${currentUser.profile_color || '#667eea'}" style="width: 100%; height: 50px; border: none; cursor: pointer;">
                </div>
                <button class="btn btn-success" onclick="updateProfileColor()" style="width: 100%;">Сохранить цвет</button>
              </div>
              
              <div>
                <div class="form-group">
                  <label>Мой титул:</label>
                  <select id="title-select" style="width: 100%; padding: 10px; border: 2px solid #e0e0e0; border-radius: 10px;">
                    <option value="">Без титула</option>
                  </select>
                </div>
                <button class="btn btn-success" onclick="updateTitle()" style="width: 100%;">Установить титул</button>
              </div>
              
              <div>
                <h4 style="margin-bottom: 10px;">🏆 Мои значки</h4>
                <div id="my-badges" style="display: flex; flex-wrap: wrap; gap: 10px; min-height: 50px;">
                  Загрузка...
                </div>
              </div>
            </div>
            
            <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
              <h4 style="margin-bottom: 10px;">📊 Статистика</h4>

    function adjustColor(color, amount) {
      const num = parseInt(color.replace('#', ''), 16);
      const r = Math.min(255, Math.max(0, (num >> 16) + amount));
      const g = Math.min(255, Math.max(0, ((num >> 8) & 0x00FF) + amount));
      const b = Math.min(255, Math.max(0, (num & 0x0000FF) + amount));
      return '#' + (0x1000000 + (r << 16) + (g << 8) + b).toString(16).slice(1);
    }

    async function requestBell() {
      const type = document.getElementById('bell-type').value;
      let requestData = { type };
      
      if (type === 'song_link') {
        const link = document.getElementById('bell-song-link').value;
        if (!link) {
          alert('Введите ссылку на песню');
          return;
        }
        requestData.mediaUrl = link;
        requestData.songName = 'Ссылка на песню';
      } else if (type === 'song_name') {
        const name = document.getElementById('bell-song-name').value;
        if (!name) {
          alert('Введите название песни');
          return;
        }
        requestData.songName = name;
        requestData.mediaUrl = '';
      } else if (type === 'video') {
        const fileInput = document.getElementById('bell-video-file');
        if (!fileInput.files || !fileInput.files[0]) {
          alert('Выберите файл видео');
          return;
        }
        const file = fileInput.files[0];
        if (file.size > 50 * 1024 * 1024) {
          alert('Файл слишком большой. Максимум 50MB');
          return;
        }
        // Convert to base64 for storage
        const reader = new FileReader();
        reader.onload = async function(e) {
          requestData.mediaUrl = e.target.result;
          requestData.songName = 'Видеофайл: ' + file.name;
          await sendBellRequest(requestData);
        };
        reader.readAsDataURL(file);
        return;
      }
      
      await sendBellRequest(requestData);
    }
    
    async function sendBellRequest(requestData) {
      if (!confirm(`Запросить песню на перемене за 40 баллов? (Доступно раз в день)`)) return;

      }
    }

    async function searchStudentsForTeacher() {
      const query = document.getElementById('teacher-student-search').value.trim();
      const resultsDiv = document.getElementById('teacher-student-results');
      
      if (query.length < 2) {
        resultsDiv.innerHTML = '<p style="color: #666; text-align: center; padding: 10px;">Введите минимум 2 символа для поиска</p>';
        return;
      }
      
      try {
        const res = await fetch(`/api/students/search?q=${encodeURIComponent(query)}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const students = await res.json();
        
        if (students.length === 0) {
          resultsDiv.innerHTML = '<p style="color: #666; text-align: center; padding: 10px;">Ученики не найдены</p>';
        } else {
          resultsDiv.innerHTML = students.map(s => `
            <div style="background: #f8f9fa; padding: 12px; margin-bottom: 8px; border-radius: 8px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent;" 
                 onmouseover="this.style.background='#e9ecef'; this.style.borderColor='#667eea';" 
                 onmouseout="this.style.background='#f8f9fa'; this.style.borderColor='transparent';"
                 onclick="selectStudentForAward(${s.id}, '${s.username}', '${s.class || ''}', ${s.balance})">
              <div style="font-size: 16px; font-weight: bold; color: #333;">${s.username}</div>
              <div style="color: #666; font-size: 13px; margin-top: 4px;">
                ID: ${s.id} | Класс: ${s.class || 'Не указан'} | Баллы: ${s.balance}
              </div>
            </div>
          `).join('');
        }
      } catch (err) {
        resultsDiv.innerHTML = '<p style="color: #dc3545; text-align: center; padding: 10px;">Ошибка поиска</p>';
      }
    }

    function selectStudentForAward(id, username, studentClass, balance) {
      document.getElementById('selected-student-id').value = id;
      document.getElementById('selected-student-name').textContent = `${username} (${studentClass || 'Нет класса'}) - ${balance} баллов`;
      document.getElementById('teacher-student-search').value = '';
      document.getElementById('teacher-student-results').innerHTML = '';
    }

    async function teacherProcessRequest(id, status) {
      const action = status === 'approved' ? 'одобрить' : 'отклонить';
      if (!confirm(`Вы уверены, что хотите ${action} этот запрос?`)) return;
      
      try {
        const res = await fetch(`/api/moderator/requests/${id}`, {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ status })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert(data.message);
          loadStudents();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при обработке запроса');
      }
    }

    async function awardPoints() {
      const studentId = document.getElementById('selected-student-id').value;
      const grade = parseInt(document.getElementById('grade-select').value);
      const reason = document.getElementById('award-reason').value;
      
      if (!studentId) {
        alert('Выберите ученика через поиск');
        return;
      }
      
      try {
        const res = await fetch('/api/teacher/award', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ studentId: parseInt(studentId), grade, reason })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert(data.message);
          // Clear selection
          document.getElementById('selected-student-id').value = '';
          document.getElementById('selected-student-name').textContent = 'Не выбран';
          document.getElementById('award-reason').value = '';
          loadStudents();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при начислении баллов');
      }
    }

        });

        const pendingBody = document.querySelector('#pending-requests-table tbody');
        pendingBody.innerHTML = pending.map(r => {
          let details = '';
          if (r.type === 'immunity') {
            details = `Предмет: <strong>${r.subject || 'Не указан'}</strong>`;
          } else if (r.type === 'bell') {
            details = r.media_url ? `<a href="${r.media_url}" target="_blank" style="color: #667eea;">🎵 ${r.subject || 'Песня'}</a>` : '🎵 Песня на перемене';

              </td>
            </tr>
          `;

        // All requests

          headers: { 'Authorization': `Bearer ${token}` }

    function toggleRoleFields() {
      const role = document.getElementById('new-role').value;
      const classField = document.getElementById('class-field');
      const subjectField = document.getElementById('subject-field');
      
      if (role === 'student') {
        classField.classList.remove('hidden');
        subjectField.classList.add('hidden');
      } else if (role === 'teacher') {
        classField.classList.add('hidden');
        subjectField.classList.remove('hidden');
      } else {
        classField.classList.add('hidden');
        subjectField.classList.add('hidden');
      }
    }

      const role = document.getElementById('new-role').value;
      const userClass = document.getElementById('new-class').value;
      const subject = document.getElementById('new-subject').value;
      
      if (!username || !password) {
        alert('Заполните все обязательные поля');
        return;
      }
      
      if (role === 'teacher' && !subject) {
        alert('Выберите предмет для учителя');
        return;
      }
      
      try {
        const res = await fetch('/api/register', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password, role, class: userClass, subject })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert(`Пользователь ${username} создан!`);
          document.getElementById('new-username').value = '';
          document.getElementById('new-password').value = '';
          document.getElementById('new-class').value = '';
          document.getElementById('new-subject').value = '';
          loadUsers();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при создании пользователя');
      }
    }

    async function deleteUser(id, username) {
      if (!confirm(`Удалить пользователя ${username}?`)) return;
      
      try {
        const res = await fetch(`/api/moderator/users/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        
        if (res.ok) {
          alert(data.message);
          loadUsers();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при удалении');
      }
    }

    function showTitleModal(userId, username) {
      const title = prompt(`Введите титул для ${username}:`);
      if (title && title.trim()) {
        setUserTitle(userId, title.trim());
      }
    }

    async function setUserTitle(userId, title) {
      try {
        const res = await fetch('/api/moderator/set-title', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ userId, title })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert(data.message);
          loadUsers();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при установке титула');
      }
    }

    async function awardLeaderTitle(userId) {
      const titleInput = document.getElementById('leader-title');
      if (!titleInput) return;
      
      const title = titleInput.value;
      if (!title || !title.trim()) {
        alert('Введите титул для лидера');
        return;
      }
      
      if (!confirm(`Выдать титул "${title}" лидеру месяца?`)) return;
      
      try {
        const res = await fetch('/api/moderator/grant-title', {
          method: 'POST',
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ userId, titleName: title.trim() })
        });
        const data = await res.json();
        
        if (res.ok) {
          alert(data.message);
          loadUsers();
        } else {
          alert(data.error);
        }
      } catch (err) {
        alert('Ошибка при выдаче титула');
      }
    }

    function showError(elementId, message) {
      const el = document.getElementById(elementId);
      el.textContent = message;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 3000);
    }
  </script>
</body>
</html>
